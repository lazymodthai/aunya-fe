name: Build, Push, and Deploy to Docker Hub
on:
  push:
    branches:
      - staging
env:
  DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
  DOCKER_IMAGE_NAME: aunya-fe
jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 3: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # Step 4: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ vars.DOCKER_HUB_ACCESS_TOKEN }}

      # Step 5: Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKER_HUB_USERNAME }}/aunya-fe:latest
          build-args: |
            VITE_ROOM_ID=${{ vars.VITE_ROOM_ID }}

      # Step 6: Deploy to Server via SSH
      - name: Deploy to Server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ vars.SERVER_ADDRESS }}
          username: ${{ vars.SERVER_USER }}
          password: ${{ vars.SERVER_PASSWORD }}
          script: |
            docker compose pull
            docker compose up -d

      # Step 7: Clean up (optional but good practice)
      - name: Clean up
        if: always()
        run: rm -rf ~/.docker
