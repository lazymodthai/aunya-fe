name: Build, Push, and Deploy to Docker Hub
on:
  push:
    branches:
      - staging
env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_IMAGE_NAME: aunya-fe

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # --- ส่วนที่แก้ไขสำคัญ ---
      - name: Build and Push Docker Image with Secure Secrets
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          # ใช้ secrets แทน build-args เพื่อความปลอดภัยและแก้ปัญหา warning
          secrets: |
            "vite_env_secret=VITE_BASE_URL=${{ secrets.VITE_BASE_URL }}
            VITE_ROOM_ID=${{ secrets.VITE_ROOM_ID }}
            VITE_JWT_SECRET=${{ secrets.VITE_JWT_SECRET }}"

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_ADDRESS }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            export DOCKER_IMAGE=${{ env.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            docker pull $DOCKER_IMAGE
            docker compose down
            docker compose up -d

      - name: Clean up
        if: always()
        run: rm -rf ~/.docker